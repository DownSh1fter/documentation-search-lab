[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-search-lab"
version = "0.1.0"
description = "A personal learning project for practicing documentation retrieval and ML engineering."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "scikit-learn>=1.4",
]

[project.scripts]
doc-search-web = "doc_search.web:main"

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.0,<6", "transformers>=4.40,<5"]
rag = ["transformers>=4.40,<5", "torch>=2.2"]
train = ["sentence-transformers>=3.0,<6", "transformers>=4.40,<5", "torch>=2.2", "datasets>=3.0,<5", "accelerate>=1.1"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
